<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexa Business Kit Mobile - Login Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #2d3a4f;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .brand-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #22c55e;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 12px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .brand-icon-text {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 600;
            color: white;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .label {
            font-size: 14px;
            font-weight: 500;
            color: #e0e3e8;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 0.3px;
        }

        .input {
            width: 100%;
            background: #3d4a5f;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 15px;
            color: white;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input:focus {
            outline: none;
            border-color: #22c55e;
            background: #4a5a72;
        }

        .input::placeholder {
            color: #8b92a0;
        }

        .button {
            width: 100%;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
        }

        .button:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-arrow {
            font-size: 20px;
        }

        .phone-frame {
            max-width: 380px;
            margin: 0 auto;
            background: white;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .phone-header {
            background: #000;
            height: 25px;
            border-radius: 0 0 20px 20px;
            margin-bottom: 0;
        }

        .phone-content {
            background: #1a1f2e;
            border-radius: 30px;
            padding: 40px 20px;
            min-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .note {
            text-align: center;
            color: #888;
            margin-top: 40px;
            font-size: 14px;
        }

        .note a {
            color: #22c55e;
            text-decoration: none;
        }

        .note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div style="width: 100%; padding: 20px;">
        <div class="phone-frame">
            <div class="phone-header"></div>
            <div class="phone-content">
                <div class="container">
                    <div class="brand-container">
                        <div class="brand-icon">
                            <span class="brand-icon-text">B</span>
                        </div>
                        <h1 class="brand-name">Hexa Business Kit</h1>
                    </div>

                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label class="label">Username</label>
                            <input type="email" class="input" placeholder="business@hexa.com" value="business@hexa.com">
                        </div>

                        <div class="form-group">
                            <label class="label">Password</label>
                            <input type="password" class="input" placeholder="Enter your password">
                        </div>

                        <button type="submit" class="button">
                            <span>Login</span>
                            <span class="button-arrow">→</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="note">
            📱 This is a web preview of your React Native app<br>
            To run the actual mobile app, you'll need an Android emulator or iOS simulator<br>
            <strong>Instructions:</strong> <a href="#setup">Setup Android Emulator</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            alert('Login button clicked! (Mock)');
        }
    </script>
</body>
</html>
